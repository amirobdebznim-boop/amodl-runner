name: Live Source Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inspect Kayn and Elftoon RSC
        run: node scripts/inspect_kayn.mjs

      - name: Run Source Audit Matrix
        run: |
          node scripts/audit_sources.mjs
          cat audit_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-results
          path: |
            audit_report.md
            audit_report.json
            kayn.html
            elftoon.html
            flight_*.html
